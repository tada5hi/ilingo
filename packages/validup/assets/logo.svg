<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ila-title">
    <title id="ila-title">ilingo logo: a message and its translation, two overlapping speech bubbles</title>
    <defs>
        <linearGradient id="ila-src" x1="24" y1="28" x2="168" y2="156" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818CF8" />
            <stop offset="1" stop-color="#6366F1" />
        </linearGradient>
        <linearGradient id="ila-dst" x1="88" y1="100" x2="232" y2="228" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2DD4BF" />
            <stop offset="1" stop-color="#0D9488" />
        </linearGradient>
        <mask id="ila-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
            <rect width="256" height="256" fill="#FFFFFF" />
            <path fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round" d="M112 100 H208 A24 24 0 0 1 232 124 V180 A24 24 0 0 1 208 204 H204 V228 L180 204 H112 A24 24 0 0 1 88 180 V124 A24 24 0 0 1 112 100 Z">
                <animateTransform attributeName="transform" type="translate" from="-20 -20" to="0 0" dur="0.9s" begin="-0.15s" repeatCount="1" fill="freeze" />
            </path>
        </mask>
    </defs>

    <!-- the source message -->
    <g mask="url(#ila-gap)">
        <path fill="url(#ila-src)" d="M48 28 H144 A24 24 0 0 1 168 52 V108 A24 24 0 0 1 144 132 H76 L52 156 V132 H48 A24 24 0 0 1 24 108 V52 A24 24 0 0 1 48 28 Z" />
        <path stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" d="M50 62 H142 M50 94 H70" />
    </g>

    <!-- its translation, the resolved line in amber -->
    <g>
        <animateTransform attributeName="transform" type="translate" from="-20 -20" to="0 0" dur="0.9s" begin="-0.15s" repeatCount="1" fill="freeze" />
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="-0.15s" repeatCount="1" fill="freeze" />
        <path fill="url(#ila-dst)" d="M112 100 H208 A24 24 0 0 1 232 124 V180 A24 24 0 0 1 208 204 H204 V228 L180 204 H112 A24 24 0 0 1 88 180 V124 A24 24 0 0 1 112 100 Z" />
        <path stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" d="M114 136 H206" />
        <path stroke="#FBBF24" stroke-width="14" stroke-linecap="round" d="M114 168 H166" />
    </g>
</svg>
